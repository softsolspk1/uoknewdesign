<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="100%" height="100%">
  <defs>
    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="bMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1C1C" />
      <stop offset="100%" stop-color="#550A0A" />
    </linearGradient>
    <linearGradient id="bDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Left: UoK Crest -->
  <g transform="translate(6, 4)">
    <circle cx="30" cy="30" r="28" fill="url(#bMaroon)" stroke="url(#bGold)" stroke-width="1.8" />
    <circle cx="30" cy="30" r="25" fill="#FFF" />
    <!-- Crescent & Star -->
    <path d="M 28 8 C 39 8 48 16 48 27 C 48 39 38 48 26 48 C 20 48 14 45 11 40 C 18 43 26 42 31 36 C 36 30 36 21 32 15 C 30 12 26 10 23 9 C 25 8 26 8 28 8 Z" fill="url(#bMaroon)" />
    <polygon points="18,10 19.5,14.5 24,14.5 20.5,17 22,21.5 18,18.5 14,21.5 15.5,17 12,14.5 16.5,14.5" fill="url(#bMaroon)" />
    <!-- Boat & waves -->
    <path d="M 18 36 C 23 39 34 39 40 35 C 41 34 39 37 36 38 C 30 40 22 40 17 37 Z" fill="url(#bMaroon)" />
    <path d="M 15 40 Q 18 39 22 40 T 29 40 T 36 40 T 42 39" stroke="url(#bMaroon)" stroke-width="1" fill="none" />
    <!-- Urdu Ribbon -->
    <rect x="12" y="44" width="36" height="10" rx="3" fill="#FFF" stroke="url(#bMaroon)" stroke-width="0.8" />
    <text x="30" y="52" font-family="'Noto Nastaliq Urdu', serif" font-size="7" font-weight="bold" fill="#771313" text-anchor="middle">جامعہ کراچی</text>
  </g>

  <!-- Center Text -->
  <g transform="translate(72, 8)">
    <text x="0" y="16" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="900" fill="#1E293B" letter-spacing="0.5">UOK • 75 YEARS</text>
    
    <g transform="translate(0, 24)">
      <polygon points="4,0 8,3.5 4,7 0,3.5" fill="url(#bDiamond)" />
      <text x="12" y="7" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" fill="#9B1C1C" letter-spacing="1">DIAMOND JUBILEE</text>
    </g>
    
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="158" height="16" rx="8" fill="url(#bMaroon)" stroke="url(#bGold)" stroke-width="0.8" />
      <text x="79" y="11.5" font-family="'Montserrat', sans-serif" font-size="7.2" font-weight="800" fill="#FFF2B2" letter-spacing="0.8" text-anchor="middle">1951–2026 • ACADEMIC LEADERSHIP</text>
    </g>
  </g>
</svg>
